name: Testy

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Składnia
        run: for f in js/*.js sw.js tools/*.js tests/mock-hermes.js; do node --check "$f"; done
      - name: Testy jednostkowe (rejestr, silnik lokalny, NLP, zdarzenia, kontekst)
        run: node --test "tests/unit/*.test.js"
  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (Chromium)
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Serwer statyczny (ten sam co lokalnie: tools/serve.js)
        run: (node tools/serve.js 8090 >/dev/null 2>&1 &) && sleep 1
      - name: Test dymny w przeglądarce
        run: node tests/e2e/smoke.js http://localhost:8090
      - name: Połączenie z Hermesem (atrapa gateway'a: CORS, klucz, czat, fallback)
        run: node tests/e2e/hermes.js http://localhost:8090
