name: Cinematic Engine CI
on:
  push:
    branches:
      - experiment/cinematic-engine
    paths:
      - apps/cinematic-engine/**
      - .github/workflows/cinematic-engine-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cinematic-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm run test:run
      - name: Typecheck and production build
        run: npm run build
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Browser UX and mobile tests
        run: npm run test:e2e
      - name: Upload screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-engine-browser-report
          path: |
            apps/cinematic-engine/test-results/
            apps/cinematic-engine/playwright-report/
          if-no-files-found: ignore
